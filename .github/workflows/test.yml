name: corpus-pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B demo.py --out demo-output
      - name: Observe storage and process capabilities
        run: python -B verify_versioned_runtime.py --probe-only
      - name: Verify versioned state and recovery
        if: runner.os == 'Linux'
        run: python -B verify_versioned_runtime.py
