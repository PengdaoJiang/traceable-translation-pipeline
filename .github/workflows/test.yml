name: corpus-pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B demo.py --out demo-output
      - name: Observe storage and process capabilities
        run: python -B verify_versioned_runtime.py --probe-only
      - name: Verify versioned state and recovery
        if: runner.os == 'Linux'
        run: python -B verify_versioned_runtime.py
